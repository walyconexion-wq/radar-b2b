    body {
      background-color: #04060E;
      color: #F8FAFC;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 3D Canvas styles */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating 3D Badges Overlay */
    #badges-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .badge-3d {
      position: absolute;
      pointer-events: auto;
      transform: translate(-50%, -100%);
      transition: opacity 0.2s ease, transform 0.15s ease-out;
      cursor: pointer;
      will-change: transform, left, top;
    }

    .badge-3d:hover {
      transform: translate(-50%, -115%) scale(1.06);
      z-index: 25;
    }

    .badge-pill {
      background: rgba(10, 14, 28, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.75), 0 0 12px -2px rgba(0, 242, 254, 0.2);
      border-radius: 9999px;
      padding: 5px 12px 5px 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .badge-3d:hover .badge-pill {
      border-color: #00F2FE;
      box-shadow: 0 12px 28px -2px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 242, 254, 0.4);
    }

    .badge-leader .badge-pill {
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.75), 0 0 14px -2px rgba(245, 158, 11, 0.3);
    }

    .badge-luz .badge-pill {

      box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.75), 0 0 16px -2px rgba(0, 242, 254, 0.4);
    }

    /* Department Tab Active */
    .dept-tab.active {
      background: rgba(0, 242, 254, 0.15);
      color: #00F2FE;
      border-color: rgba(0, 242, 254, 0.4);
      box-shadow: 0 0 20px -3px rgba(0, 242, 254, 0.25);
    }

    /* Secret Bunker Easter Egg */
    .bunker-trigger {
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .bunker-trigger:active {
      transform: scale(0.92);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 242, 254, 0.4);
    }

    /* Task Pulse Animation */
    @keyframes taskPulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    .executing-task {
      animation: taskPulse 1.2s infinite ease-in-out;
      border-color: #10B981 !important;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.5) !important;
    }

  <script>
    let scene, camera, renderer, controls;

    // Web Audio Synthesizer for High-Tech FX (Lazily initialized)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playBeep(freq = 600, duration = 0.08, type = 'sine') {
      if (!audioEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // Camera Lerp Animation System
    let targetCamera = {

    function init3D() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      // 1. Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04060E);
      scene.fog = new THREE.FogExp2(0x04060E, 0.012);

      // 2. Camera (True Isometric Setup)
      const aspect = width / height;
      const d = 26; // Frustum size
      camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
      
      // Classic 35.264° isometric angle
      camera.position.set(45, 40, 45);
      camera.lookAt(0, 0, 0);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('three-canvas'),
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      // 4. Controls (Smooth OrbitControls)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2.25;
      controls.minPolarAngle = Math.PI / 8;
      controls.enableRotate = true;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.zoomSpeed = 1.2;

    function createGridTexture(lineColor = '#1e293b', bgColor = '#090d1c') {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, 128, 128);
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.fillRect(4, 4, 120, 120);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2c1810';
      ctx.fillRect(0, 0, 256, 256);
      
      for (let i = 0; i < 8; i++) {
        const y = i * 32;
        ctx.fillStyle = i % 2 === 0 ? '#381f14' : '#27140c';
        ctx.fillRect(0, y, 256, 30);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, y + 30, 256, 2);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3, 3);
      return texture;
    }

    // 3D ILLUMINATED DEPARTMENT SIGNAGE
    function createDepartmentSign(x, y, z, rotY, title, subtitle, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 128);
      grad.addColorStop(0, '#070b1a');
      grad.addColorStop(1, '#0e162e');
      ctx.fillStyle = grad;
      
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(4, 4, 504, 120, 18);
      } else {
        ctx.rect(4, 4, 504, 120);
      }
      ctx.fill();

      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 32px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 256, 52);

      ctx.fillStyle = colorHex;
      ctx.font = 'bold 18px "JetBrains Mono", monospace';
      ctx.fillText(subtitle, 256, 92);

      const tex = new THREE.CanvasTexture(canvas);
      const signGeo = new THREE.PlaneGeometry(8.2, 2.05);
      const signMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        side: THREE.DoubleSide
      });
      const signMesh = new THREE.Mesh(signGeo, signMat);
      signMesh.position.set(x, y, z);
      signMesh.rotation.y = rotY;
      scene.add(signMesh);
      return signMesh;
    }

      } else {
        const tex = createGridTexture(style === 'tech' ? '#00f2fe' : (style === 'ops' ? '#10b981' : '#f59e0b'));
        tex.repeat.set(width / 4, depth / 4);
        mat = new THREE.MeshStandardMaterial({
          map: tex,
          color: style === 'tech' ? 0x0e1326 : 0x0a0f20,
          roughness: 0.7,
          metalness: 0.2
        });
      }

      const platform = new THREE.Mesh(geo, mat);
      platform.castShadow = true;
      platform.receiveShadow = true;
      group.add(platform);

      // Glowing Neon Perimeter Border
      const borderGeo = new THREE.BoxGeometry(width + 0.3, 0.1, depth + 0.3);
      const borderMat = new THREE.MeshBasicMaterial({
        color: glowColor,
        transparent: true,
        opacity: 0.85
      });
      const border = new THREE.Mesh(borderGeo, borderMat);
      border.position.y = height / 2 + 0.05;
      group.add(border);

      // Back Wall
      const wallGeo = new THREE.BoxGeometry(width, 4, 0.4);
      const wallMat = new THREE.MeshStandardMaterial({
        color: 0x070a16,
        roughness: 0.8,
        metalness: 0.3
      });
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(0, 2 + height / 2, -depth / 2 + 0.2);
      wall.castShadow = true;
      wall.receiveShadow = true;
      group.add(wall);

      // Glass Railing
      buildGlassRailing(group, width, height / 2, depth / 2 - 0.2);

      scene.add(group);
      return group;
    }

    function buildGlassRailing(parent, width, y, z) {
      const glassGeo = new THREE.BoxGeometry(width * 0.95, 1.2, 0.08);

    function buildStairsAndWalkways() {
      const stairsGroup = new THREE.Group();
      const numSteps = 5;
      const stepWidth = 6;
      const stepDepth = 1.0;
      const stepHeight = 1.2 / numSteps;

      for (let i = 0; i < numSteps; i++) {
        const stepGeo = new THREE.BoxGeometry(stepWidth, stepHeight, stepDepth);
        const stepMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          roughness: 0.5,
          metalness: 0.4
        });
        const step = new THREE.Mesh(stepGeo, stepMat);
        step.position.set(0, -1.2 + (i + 0.5) * stepHeight, (i - 2) * stepDepth);
        step.castShadow = true;
        step.receiveShadow = true;
        stairsGroup.add(step);

        const ledGeo = new THREE.BoxGeometry(stepWidth - 0.2, 0.04, 0.04);
        const ledMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
        const led = new THREE.Mesh(ledGeo, ledMat);
        led.position.set(0, -1.2 + (i + 1) * stepHeight, (i - 2) * stepDepth + stepDepth / 2);
        stairsGroup.add(led);
      }
      scene.add(stairsGroup);
    }

    function createDesk(x, y, z, rotY = 0, agentId = null, monitorColor = 0x00f2fe) {
      const deskGroup = new THREE.Group();
      deskGroup.position.set(x, y, z);
      deskGroup.rotation.y = rotY;

      // Tabletop
      const topGeo = new THREE.BoxGeometry(3.6, 0.15, 1.8);
      const topMat = new THREE.MeshStandardMaterial({
        color: 0x181008,
        roughness: 0.4,
        metalness: 0.2
      });
      const top = new THREE.Mesh(topGeo, topMat);
      top.position.y = 1.1;
      top.castShadow = true;
      top.receiveShadow = true;
      deskGroup.add(top);

      // Legs
      const legGeo = new THREE.BoxGeometry(0.12, 1.1, 1.6);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.3 });
      
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-1.6, 0.55, 0);
      deskGroup.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(1.6, 0.55, 0);
      deskGroup.add(rightLeg);

      // Modesty Panel
      const panelGeo = new THREE.BoxGeometry(3.2, 0.7, 0.05);
      const panelMat = new THREE.MeshStandardMaterial({ color: 0x1f140d, roughness: 0.6 });
      const panel = new THREE.Mesh(panelGeo, panelMat);
      panel.position.set(0, 0.75, -0.75);
      deskGroup.add(panel);

      // Dual Monitors
      for (let m = -0.7; m <= 0.7; m += 1.4) {
        const standGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8);
        const standMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
        const stand = new THREE.Mesh(standGeo, standMat);
        stand.position.set(m, 1.25, -0.4);
        deskGroup.add(stand);

        const screenGeo = new THREE.BoxGeometry(1.2, 0.75, 0.06);
        const screenMat = new THREE.MeshStandardMaterial({ color: 0x050711, roughness: 0.4 });
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.position.set(m, 1.65, -0.4);
        screen.rotation.y = m < 0 ? 0.12 : -0.12;
        screen.castShadow = true;
        deskGroup.add(screen);

        const displayGeo = new THREE.PlaneGeometry(1.1, 0.65);
        const displayMat = new THREE.MeshBasicMaterial({ color: monitorColor });
        const display = new THREE.Mesh(displayGeo, displayMat);
        display.position.set(m, 1.65, -0.36);
        display.rotation.y = m < 0 ? 0.12 : -0.12;
        deskGroup.add(display);
      }

      // Keyboard & Mouse
      const kbGeo = new THREE.BoxGeometry(1.0, 0.03, 0.35);
      const kbMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
      const kb = new THREE.Mesh(kbGeo, kbMat);
      kb.position.set(0, 1.19, 0.2);
      deskGroup.add(kb);

      const mouseGeo = new THREE.BoxGeometry(0.12, 0.03, 0.2);
      const mouse = new THREE.Mesh(mouseGeo, kbMat);
      mouse.position.set(0.7, 1.19, 0.2);
      deskGroup.add(mouse);

      // Chair
      createChair(deskGroup, 0, 0, 1.1, Math.PI);

      if (agentId) {
        top.userData = { agentId: agentId };
        interactiveObjects.push(top);
      }

      scene.add(deskGroup);
      return deskGroup;
    }

    function createPlant(x, y, z) {
      const plant = new THREE.Group();
      plant.position.set(x, y, z);

      const potGeo = new THREE.CylinderGeometry(0.6, 0.45, 1.1, 12);
      const potMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3 });
      const pot = new THREE.Mesh(potGeo, potMat);
      pot.position.y = 0.55;
      pot.castShadow = true;
      plant.add(pot);

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.6 });
      for (let i = 0; i < 7; i++) {
        const leafGeo = new THREE.SphereGeometry(0.45, 6, 6);
        leafGeo.scale(1.2, 0.3, 0.9);
        const leaf = new THREE.Mesh(leafGeo, leafMat);
        const angle = (i / 7) * Math.PI * 2;
        leaf.position.set(Math.cos(angle) * 0.45, 1.1 + Math.sin(i) * 0.25, Math.sin(angle) * 0.45);
        leaf.rotation.y = angle;
        leaf.rotation.z = 0.3;
        leaf.castShadow = true;
        plant.add(leaf);
      }
      scene.add(plant);
    }

    // 3D CHARACTER AVATAR GENERATOR (PLAYMOBIL STYLED)
    function createCharacter(agentId, config) {
      const char = new THREE.Group();
      const pos = config.pos3d;
      char.position.set(pos.x, pos.y, pos.z);

      const hitBox = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 3.2, 1.8),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitBox.position.y = 1.4;
      hitBox.userData = { agentId: agentId };
      char.add(hitBox);
      interactiveObjects.push(hitBox);

      // 1. PLAYMOBIL CYLINDRICAL HEAD & CHIN DOME
      const skinColor = config.skinColor || 0xffd5b8;
      const skinMat = new THREE.MeshStandardMaterial({
        color: skinColor,
        roughness: 0.5
      });
      const head = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.30, 0.44, 16), skinMat);
      head.position.y = 2.45;
      head.castShadow = true;
      char.add(head);

      const chinDome = new THREE.Mesh(new THREE.SphereGeometry(0.33, 12, 8), skinMat);
      chinDome.position.y = 0.22;
      head.add(chinDome);

      // 2. FACIAL FEATURES & ACCESSORIES
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
      const eyeHighlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      if (agentId === 'luz') {
        // Luz: Glowing Cybernetic Cyan Visor
        const visorGeo = new THREE.BoxGeometry(0.54, 0.12, 0.12);
        const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.set(0, 0.05, 0.28);
        head.add(visor);
      } else if (agentId === 'walter') {
        // Walter: Smart Executive Glasses / Confident Eyes
        const glassesGeo = new THREE.BoxGeometry(0.56, 0.14, 0.14);
        const glassesMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
        const glasses = new THREE.Mesh(glassesGeo, glassesMat);
        glasses.position.set(0, 0.05, 0.27);
        head.add(glasses);
      } else {
        // Standard Playmobil Cute Big Eyes with Highlights
        for (let side of [-1, 1]) {
          const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
          const eye = new THREE.Mesh(eyeGeo, eyeMat);
          eye.position.set(side * 0.12, 0.04, 0.31);
          head.add(eye);

          const shineGeo = new THREE.SphereGeometry(0.016, 6, 6);
          const shine = new THREE.Mesh(shineGeo, eyeHighlightMat);
          shine.position.set(side * 0.12 + 0.012, 0.052, 0.34);
          head.add(shine);

          const browGeo = new THREE.BoxGeometry(0.09, 0.02, 0.02);
          const brow = new THREE.Mesh(browGeo, eyeMat);
          brow.position.set(side * 0.12, 0.12, 0.31);
          brow.rotation.z = side * -0.15;
          head.add(brow);
        }
      }

      // Smile
      const smileGeo = new THREE.TorusGeometry(0.07, 0.016, 6, 12, Math.PI);
      const smileMat = new THREE.MeshBasicMaterial({ color: 0x854d0e });
      const smile = new THREE.Mesh(smileGeo, smileMat);
      smile.rotation.x = Math.PI / 2;
      smile.rotation.z = Math.PI;
      smile.position.set(0, -0.10, 0.31);
      head.add(smile);

      // Over-Ear Tech Headphones for Scraping & Ops Specialists
      if (['crawl4ai', 'playwright', 'scrapy', 'telegram-bot'].includes(agentId)) {
        const hpColor = agentId === 'crawl4ai' ? 0x00f2fe : (agentId === 'playwright' ? 0x6366f1 : 0x10b981);
        const hpMat = new THREE.MeshStandardMaterial({ color: hpColor, metalness: 0.6 });
        const bandGeo = new THREE.TorusGeometry(0.36, 0.04, 8, 16, Math.PI);
        const band = new THREE.Mesh(bandGeo, hpMat);
        band.rotation.z = Math.PI;
        band.position.set(0, 0.16, 0);
        head.add(band);

        for (let side of [-1, 1]) {
          const cupGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 12);
          const cup = new THREE.Mesh(cupGeo, hpMat);
          cup.rotation.z = Math.PI / 2;
          cup.position.set(side * 0.34, 0.02, 0);
          head.add(cup);
        }
      }

      // 3. PLAYMOBIL HAIR
      const hairColor = config.hairColor || 0x1e293b;
      const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.4 });
      const hairGeo = new THREE.SphereGeometry(0.38, 12, 10);
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.position.set(0, 0.18, -0.04);
      hair.scale.set(1.05, 0.9, 1.05);
      head.add(hair);

      // 4. TORSO
      const torsoGeo = new THREE.BoxGeometry(0.85, 1.05, 0.55);
      const jacketMat = new THREE.MeshStandardMaterial({
        color: config.jacketColor || 0x0f172a,
        roughness: 0.5
      });
      const torso = new THREE.Mesh(torsoGeo, jacketMat);
      torso.position.y = 1.65;
      torso.castShadow = true;
      char.add(torso);

      // 5. ARTICULATED ARMS & PLAYMOBIL C-HANDS
      const isSeated = agentId !== 'walter' && agentId !== 'luz';
      const armMat = new THREE.MeshStandardMaterial({ color: config.jacketColor || 0x0f172a });
      const handMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.4 });

      // Left Arm
      const leftArm = new THREE.Group();
      leftArm.position.set(-0.52, 2.05, 0);
      
      const upperArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.10, 0.55, 8), armMat);
      upperArmL.position.y = -0.25;
      leftArm.add(upperArmL);

      const foreArmL = new THREE.Group();
      foreArmL.position.set(0, -0.5, 0);
      const foreArmLMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.45, 8), armMat);
      foreArmLMesh.position.y = -0.2;
      foreArmL.add(foreArmLMesh);

      // Playmobil C-Hand Left
      const handL = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.026, 6, 12, Math.PI * 1.5), handMat);
      handL.position.set(0, -0.42, 0);
      handL.rotation.y = Math.PI / 2;
      foreArmL.add(handL);
      leftArm.add(foreArmL);
      char.add(leftArm);

      // Right Arm
      const rightArm = new THREE.Group();
      rightArm.position.set(0.52, 2.05, 0);

      const upperArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.10, 0.55, 8), armMat);
      upperArmR.position.y = -0.25;
      rightArm.add(upperArmR);

      const foreArmR = new THREE.Group();
      foreArmR.position.set(0, -0.5, 0);
      const foreArmRMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.45, 8), armMat);
      foreArmRMesh.position.y = -0.2;
      foreArmR.add(foreArmRMesh);

      // Playmobil C-Hand Right
      const handR = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.026, 6, 12, Math.PI * 1.5), handMat);
      handR.position.set(0, -0.42, 0);
      handR.rotation.y = Math.PI / 2;
      foreArmR.add(handR);
      rightArm.add(foreArmR);
      char.add(rightArm);

      // Default Poses
      if (isSeated) {
        // Seated typing pose: hands positioned on keyboard
        leftArm.rotation.x = -1.15;
        leftArm.rotation.z = 0.22;
        foreArmL.rotation.x = -0.4;

        rightArm.rotation.x = -1.15;
        rightArm.rotation.z = -0.22;
        foreArmR.rotation.x = -0.4;
      } else if (agentId === 'walter') {
        leftArm.rotation.x = 0.2;
        leftArm.rotation.z = -0.25;
        rightArm.rotation.x = -0.4;
        rightArm.rotation.z = 0.3;
      } else if (agentId === 'luz') {
        leftArm.rotation.x = -0.8;
        leftArm.rotation.z = -0.2;
        rightArm.rotation.x = -0.5;
        rightArm.rotation.z = 0.25;

        // Halo
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.04, 8, 24), new THREE.MeshBasicMaterial({ color: 0x00f2fe }));
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 2.95;
        char.add(ring);

        // Hologram Tablet
        const tab = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.04), new THREE.MeshBasicMaterial({ color: 0x00f2fe }));
        tab.position.set(0.4, 1.5, 0.35);
        tab.rotation.x = 0.4;
        char.add(tab);
      }

      // 6. LEGS & SHOES
      const legGeo = new THREE.BoxGeometry(0.28, 1.1, 0.32);
      const pantsMat = new THREE.MeshStandardMaterial({
        color: config.pantsColor || 0x1e293b,
        roughness: 0.7
      });
      
      const leftLeg = new THREE.Mesh(legGeo, pantsMat);
      leftLeg.position.set(-0.22, 0.6, 0);
      leftLeg.castShadow = true;
      char.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, pantsMat);
      rightLeg.position.set(0.22, 0.6, 0);
      rightLeg.castShadow = true;
      char.add(rightLeg);

      const shoeGeo = new THREE.BoxGeometry(0.3, 0.18, 0.48);
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0x050711 });
      
      const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
      leftShoe.position.set(-0.22, 0.09, 0.08);
      char.add(leftShoe);

      const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
      rightShoe.position.set(0.22, 0.09, 0.08);
      char.add(rightShoe);

      scene.add(char);
      characterMeshes[agentId] = {
        mesh: char,
        head: head,
        leftArm: leftArm,
        rightArm: rightArm,
        foreArmL: foreArmL,
        foreArmR: foreArmR,
        isSeated: isSeated,
        initialY: pos.y,
        seed: Math.random() * 10
      };
      return char;
    }

    const tempV = new THREE.Vector3();
    function updateBadgePositions() {
      if (!labelsVisible) return;
      const width = renderer.domElement.clientWidth;
      const height = renderer.domElement.clientHeight;

      for (const [id, agent] of Object.entries(AGENTS)) {
        const badge = document.getElementById(`badge-${id}`);
        if (!badge) continue;

        const pos = agent.pos3d;
        tempV.set(pos.x, pos.y + 3.1, pos.z);
        tempV.project(camera);

        if (tempV.z < 1) {
          const x = (tempV.x * 0.5 + 0.5) * width;
          const y = (-(tempV.y * 0.5) + 0.5) * height;

          badge.style.left = `${x}px`;
          badge.style.top = `${y}px`;
          badge.style.opacity = '1';
        } else {
          badge.style.opacity = '0';
        }
      }

      // Position Live Collaboration Conduit Badge
      const cBadge = document.getElementById('badge-conduit');
      if (cBadge && conduitCurve) {
        tempV.set(0, 7.3, 4.0);
        tempV.project(camera);
        if (tempV.z < 1) {
          const x = (tempV.x * 0.5 + 0.5) * width;
          const y = (-(tempV.y * 0.5) + 0.5) * height;
          cBadge.style.left = `${x}px`;
          cBadge.style.top = `${y}px`;
          cBadge.style.opacity = '1';
        } else {
          cBadge.style.opacity = '0';
        }
      }
    }

    // RAYCASTING
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function setupRaycasting() {
      const canvas = renderer.domElement;

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveObjects, true);

        if (intersects.length > 0) {
          let target = intersects[0].object;
          while (target && !target.userData.agentId && target.parent) {
            target = target.parent;
          }
          if (target && target.userData.agentId) {
            playBeep(850, 0.08);
            selectAgentAndOpenModal(target.userData.agentId);
          }
        }
      });
    }

    function selectAgentAndOpenModal(agentId) {
      const data = AGENTS[agentId];
      if (!data) return;

      if (selectionRing) {
        selectionRing.position.set(data.pos3d.x, data.pos3d.y + 0.05, data.pos3d.z);
        selectionRing.visible = true;
      }

      flyToCoordinates(data.pos3d.x, data.pos3d.y, data.pos3d.z, 1.8);

      if (agentId === 'ari-agent' && typeof window.openAriChat === 'function') {
        window.openAriChat();
      } else {
        openTacticalModal(agentId);
      }
    }

    function flyToCoordinates(x, y, z, zoom = 1.5) {
      targetCamera.x = x;
      targetCamera.y = y;
      targetCamera.z = z;
      targetCamera.zoom = zoom;
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;
      const aspect = width / height;
      const d = 26;

      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    // ANIMATE LOOP
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      controls.target.x += (targetCamera.x - controls.target.x) * 0.07;
      controls.target.y += (targetCamera.y - controls.target.y) * 0.07;
      controls.target.z += (targetCamera.z - controls.target.z) * 0.07;

      if (Math.abs(camera.zoom - targetCamera.zoom) > 0.005) {
        camera.zoom += (targetCamera.zoom - camera.zoom) * 0.07;
        camera.updateProjectionMatrix();
        document.getElementById('zoom-level-text').textContent = `${Math.round(camera.zoom * 100)}%`;
      }

      controls.update();

      // Articulated Playmobil Animation (Breathing, Head Turning & Fast Typing)
      for (const [id, item] of Object.entries(characterMeshes)) {
        const time = elapsedTime * 2.2 + item.seed;
        item.mesh.position.y = item.initialY + Math.sin(time) * 0.03;
        
        if (item.head) {
          item.head.rotation.y = Math.sin(time * 0.4) * 0.14;
        }

        // Seated agents: Rapid realistic typing motion on keyboard!
        if (item.isSeated && item.leftArm && item.rightArm) {
          const typeSpeed = 16;
          item.leftArm.rotation.x = -1.15 + Math.sin(elapsedTime * typeSpeed + item.seed) * 0.09;
          item.rightArm.rotation.x = -1.15 + Math.cos(elapsedTime * typeSpeed + item.seed + 1.6) * 0.09;
        } else if (id === 'walter' && item.rightArm) {
          // Walter leadership gestures
          item.rightArm.rotation.x = -0.4 + Math.sin(elapsedTime * 1.5) * 0.09;
        } else if (id === 'luz' && item.rightArm) {
          // Luz tapping holographic tablet
          item.rightArm.rotation.x = -0.5 + Math.sin(elapsedTime * 3.2) * 0.11;
        }
      }

      // Live Collaboration Conduit Energy Flow (Ari -> Tool Router)
      if (conduitCurve && conduitParticles.length > 0) {
        conduitParticles.forEach((orb, idx) => {
          const t = (elapsedTime * 0.22 + (idx / conduitParticles.length)) % 1.0;
          orb.position.copy(conduitCurve.getPoint(t));
          const s = 0.85 + Math.sin(elapsedTime * 8 + idx) * 0.25;
          orb.scale.set(s, s, s);
        });
      }

      if (selectionRing && selectionRing.visible) {
        selectionRing.rotation.z += 0.02;
        const scale = 1.0 + Math.sin(elapsedTime * 4) * 0.08;
        selectionRing.scale.set(scale, scale, scale);
      }

      renderer.render(scene, camera);
      updateBadgePositions();
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3D();
    });
  </script>

            </p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-black/50 p-3.5 rounded-2xl border border-white/5 space-y-1">
              <span class="text-slate-400 text-[10px]">Ecuación X (Rentabilidad)</span>
              <div class="text-lg font-bold text-emerald-400 font-mono">$1,500 USD / mes</div>
              <span class="text-[9px] text-slate-500 block">Con solo 4 horas diarias de supervisión humana</span>
            </div>

            <div class="bg-black/50 p-3.5 rounded-2xl border border-white/5 space-y-1">
              <span class="text-slate-400 text-[10px]">Retainers Mensuales</span>
              <div class="text-lg font-bold text-cyan-400 font-mono">$450 - $650 USD</div>
              <span class="text-[9px] text-slate-500 block">Por cliente de e-commerce retail</span>
            </div>

            <div class="bg-black/50 p-3.5 rounded-2xl border border-white/5 space-y-1">
              <span class="text-slate-400 text-[10px]">Velocidad de Alerta Push</span>
              <div class="text-lg font-bold text-white font-mono">&lt; 24 Segundos</div>
              <span class="text-[9px] text-slate-500 block">Detección de quiebres directo a Telegram</span>
            </div>

            <div class="bg-black/50 p-3.5 rounded-2xl border border-white/5 space-y-1">
              <span class="text-slate-400 text-[10px]">Capacidad de Raspado</span>
              <div class="text-lg font-bold text-amber-400 font-mono">50 req / seg</div>
              <span class="text-[9px] text-slate-500 block">Pipeline Scrapy + Crawl4AI + Playwright</span>
            </div>
          </div>
        </div>
      `;

      modalTabBody.innerHTML = html;
    }

    // 5. SUBAGENT SPECIALIST VIEWS
    function renderSubagentLastTask(agent) {
      const task = agent.lastTask;
      let html = `
        <div class="space-y-4">
          <div class="bg-black/60 border border-white/10 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-white/5 pb-2">
              <span class="text-slate-400 text-[10px] uppercase">Registro de Misión</span>
              <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[9px] font-bold border border-emerald-500/30">
                ${task.status}
              </span>
            </div>

            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Misión Ejecutada:</span>
              <h4 class="font-bold text-white text-xs leading-snug">${task.title}</h4>
            </div>

            <div class="bg-black/50 p-3 rounded-xl border border-white/5 space-y-1 text-[11px] font-mono text-slate-300">
              <span class="text-slate-500 text-[9px] block">RESULTADO TELEMÉTRICO:</span>
              <div>${task.result}</div>
            </div>

            <div class="text-[10px] text-slate-500 font-mono">
              📅 Fecha de Emisión & Cierre: <b class="text-cyan-400">${task.date}</b>
            </div>
          </div>
        </div>
      `;

      modalTabBody.innerHTML = html;

      modalFooterAction.innerHTML = `
        <button id="re-run-task-btn" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-slate-950 font-bold text-xs hover:opacity-90 transition-all flex items-center gap-1.5">
          <span>⚡</span><span>Forzar Re-ejecución</span>
        </button>
      `;

      document.getElementById('re-run-task-btn').addEventListener('click', () => {
        triggerSimulatedSubagentTask(agent);
      });
    }

    function renderSubagentPendingTasks(agent) {
      let html = `<div class="space-y-3">`;

      if (agent.pendingTasks.length === 0) {
        html += `<div class="p-6 text-center text-slate-500">No hay tareas pendientes en la cola.</div>`;
      } else {
        agent.pendingTasks.forEach(task => {
          html += `
            <div class="bg-black/50 border border-white/10 rounded-2xl p-4 space-y-2">
              <div class="flex items-start justify-between">
                <div>
                  <span class="px-2 py-0.5 rounded-md bg-cyan-500/10 text-cyan-300 text-[9px] font-bold border border-cyan-500/20">
                    ${task.project}
                  </span>
                  <h4 class="font-bold text-white text-xs mt-1">${task.title}</h4>
                </div>
                <span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[9px] font-bold">
                  ${task.priority}
                </span>
              </div>
              <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-white/5">
                <span>📅 ${task.date}</span>
                <span class="text-cyan-400 font-bold">${task.progress}%</span>
              </div>
            </div>
          `;
        });
      }

      html += `</div>`;
      modalTabBody.innerHTML = html;
    }

    function renderSubagentMetrics(agent) {
      let html = `
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/[0.03] p-4 rounded-2xl border border-white/5 space-y-1">
              <span class="text-slate-400 text-[10px]">${agent.metric1Label}</span>
              <div class="text-lg font-bold text-white font-mono">${agent.metric1Val}</div>
            </div>
            <div class="bg-white/[0.03] p-4 rounded-2xl border border-white/5 space-y-1">
              <span class="text-slate-400 text-[10px]">${agent.metric2Label}</span>
              <div class="text-lg font-bold text-cyan-400 font-mono">${agent.metric2Val}</div>
            </div>
          </div>

          <div>
            <span class="text-[10px] text-slate-400 uppercase tracking-wider block mb-2">Herramientas & Heavy Stack:</span>
            <div class="flex flex-wrap gap-1.5">
              ${agent.stack.map(s => `<span class="px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-[10px] font-mono text-cyan-300">${s}</span>`).join('')}
            </div>
          </div>

          <div class="bg-black/50 p-4 rounded-2xl border border-white/5">
            <span class="text-[10px] text-slate-400 uppercase block mb-1">Misión Permanente:</span>
            <p class="text-slate-300 text-xs leading-relaxed font-light">${agent.mission}</p>
          </div>
        </div>
      `;
      modalTabBody.innerHTML = html;
    }

    function renderSubagentDeploy(agent) {
      let html = `
        <div class="space-y-4 text-center py-4">
          <div class="w-16 h-16 rounded-3xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-3xl mx-auto shadow-lg shadow-cyan-500/20">
            ${agent.icon}
          </div>
          <div>
            <h3 class="font-bold text-white text-base font-mono">Despliegue Operativo Inmediato</h3>
            <p class="text-slate-400 text-xs mt-1 max-w-md mx-auto font-light">
              Asigna una misión prioritaria en tiempo real a este agente. Se conectará con el motor de inferencia y ejecutará su tarea de scraping/alerta en el visor 3D.
            </p>
          </div>

          <button id="deploy-mission-btn" class="px-6 py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-bold text-xs font-mono shadow-lg shadow-cyan-500/20 transition-all transform hover:scale-[1.03] inline-flex items-center gap-2">
            <span>⚡</span>
            <span>Lanzar Misión Inmediata</span>
          </button>
        </div>
      `;

      modalTabBody.innerHTML = html;

      document.getElementById('deploy-mission-btn').addEventListener('click', () => {
        triggerSimulatedSubagentTask(agent);
      });
    }

    function triggerSimulatedSubagentTask(agent) {
      playBeep(1200, 0.18, 'triangle');
      const btn = document.getElementById('deploy-mission-btn') || document.getElementById('re-run-task-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span><span>Ejecutando en 3D...</span>`;
      }

      setTimeout(() => {
        playBeep(900, 0.1);
      }, 600);

      setTimeout(() => {
        playBeep(1350, 0.25);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>✅</span><span>Misión Completada con Éxito</span>`;
        }
        // Update last task time
        agent.lastTask.date = `Hoy, ${new Date().toLocaleTimeString()}`;
      }, 1500);
    }
  </script>

  <!-- ============================================== -->
  <!-- TOP BAR & CONTROLS SCRIPT -->
  <!-- ============================================== -->
  <script>
    // Secret Bunker Easter Egg: 4 clicks on logo
    let bunkerClicks = 0;
    const logoTrigger = document.getElementById('secret-bunker-logo');
    logoTrigger.addEventListener('click', () => {
      bunkerClicks++;
      playBeep(400 + bunkerClicks * 150, 0.1, 'triangle');
      if (bunkerClicks >= 4) {
        window.location.href = 'bunker.html';
      }
    });

    // Audio Mute Toggle
    const audioBtn = document.getElementById('audio-toggle-btn');
    audioBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      audioBtn.textContent = audioEnabled ? '🔊' : '🔇';
    });

    // Toggle Badges
    const labelsBtn = document.getElementById('toggle-labels-btn');
    labelsBtn.addEventListener('click', () => {
      labelsVisible = !labelsVisible;
      const overlay = document.getElementById('badges-overlay');
      overlay.style.display = labelsVisible ? 'block' : 'none';
      labelsBtn.style.color = labelsVisible ? '#00f2fe' : '#64748b';
    });

    // Zoom Controls
    document.getElementById('zoom-in-btn').addEventListener('click', () => {
      targetCamera.zoom = Math.min(targetCamera.zoom * 1.25, 3.0);
      playBeep(700, 0.05);
    });

    document.getElementById('zoom-out-btn').addEventListener('click', () => {
      targetCamera.zoom = Math.max(targetCamera.zoom * 0.8, 0.5);
      playBeep(500, 0.05);
    });

    document.getElementById('center-view-btn').addEventListener('click', () => {
      targetCamera.x = 0;
      targetCamera.y = 0;
      targetCamera.z = 0;
      targetCamera.zoom = 1.0;
      playBeep(600, 0.08);
      document.querySelectorAll('.dept-tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-dept="all"]').classList.add('active');
      if (selectionRing) selectionRing.visible = false;
    });

    // Fullscreen Toggle
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Department Tab Navigation (Camera Fly-To)
    const deptTabs = document.querySelectorAll('.dept-tab');
    deptTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        deptTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const dept = tab.getAttribute('data-dept');
        const target = DEPT_CAMERAS[dept] || DEPT_CAMERAS['all'];

        playBeep(750, 0.1, 'sawtooth');
        flyToCoordinates(target.x, target.y, target.z, target.zoom);
      });
    });
  </script>
